name: Commande Repas

on:
  # Plan B : le planificateur GitHub (peu fiable, souvent en retard ou sauté).
  # 4 crons pour couvrir heure d'été et d'hiver ; le filtre ci-dessous
  # vérifie l'heure réelle à Paris.
  schedule:
    - cron: '7 4 * * 1-2'
    - cron: '37 4 * * 1-2'
    - cron: '7 5 * * 1-2'
    - cron: '37 5 * * 1-2'
  # Plan A : déclenché par cron-job.org via l'API GitHub, ou à la main.
  workflow_dispatch:
    inputs:
      force:
        description: "Ignorer la fenêtre horaire et l'anti-doublon (tests, peut commander !)"
        type: boolean
        default: false
      test_mail:
        description: "Tester seulement l'e-mail récapitulatif (ne commande rien)"
        type: boolean
        default: false

concurrency:
  group: commande-repas
  cancel-in-progress: false

jobs:
  # Test de l'e-mail d'alerte, sans toucher au site
  test-mail:
    if: ${{ inputs.test_mail }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Envoyer un e-mail de test (faux solde, faux choix, fausses captures)
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEUIL_SOLDE: "1.00"
          MAIL_A_CHAQUE_COMMANDE: "true"
        run: |
          echo "0.50" > solde.txt
          printf 'Plat : PLAT DE TEST\nDessert 1 : DESSERT DE TEST\nDessert 2 : AUTRE DESSERT DE TEST\n' > choix.txt
          PNG='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
          for f in 06_avant_Plat 07_avant_Dessert_1 08_avant_Dessert_2; do
            echo "$PNG" | base64 -d > "$f.png"
          done
          python mail_commande.py

  order:
    if: ${{ !inputs.test_mail }}
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier la fenêtre horaire (Paris)
        id: gate
        env:
          FORCE: ${{ inputs.force }}
        run: |
          HOUR=$((10#$(TZ=Europe/Paris date +%H)))
          DAY=$(TZ=Europe/Paris date +%F)
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "Heure à Paris : ${HOUR}h, date : $DAY, force=$FORCE"
          # Les commandes ouvrent à 6h et ferment à 10h
          if [ "$FORCE" = "true" ] || { [ "$HOUR" -ge 6 ] && [ "$HOUR" -lt 10 ]; }; then
            echo "inwindow=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hors de la fenêtre 6h-10h, on sort."
            echo "inwindow=false" >> "$GITHUB_OUTPUT"
          fi

      # Anti-doublon : un cache existe si une commande a déjà réussi aujourd'hui
      - name: Vérifier si déjà commandé aujourd'hui
        id: done
        if: steps.gate.outputs.inwindow == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ordered.flag
          key: commande-${{ steps.gate.outputs.day }}

      - name: Décider
        id: decide
        env:
          FORCE: ${{ inputs.force }}
          INWINDOW: ${{ steps.gate.outputs.inwindow }}
          CACHE_HIT: ${{ steps.done.outputs.cache-hit }}
        run: |
          if [ "$INWINDOW" = "true" ] && { [ "$FORCE" = "true" ] || [ "$CACHE_HIT" != "true" ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rien à faire (hors fenêtre ou déjà commandé aujourd'hui)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.run == 'true'
        with:
          python-version: '3.11'

      - name: Installer Playwright
        if: steps.decide.outputs.run == 'true'
        run: pip install playwright && playwright install --with-deps chromium

      - name: Lancer la commande
        if: steps.decide.outputs.run == 'true'
        env:
          BOT_USER: ${{ secrets.BOT_USER }}
          BOT_PASS: ${{ secrets.BOT_PASS }}
        run: python bot.py

      - name: Marquer comme commandé
        if: steps.decide.outputs.run == 'true' && success()
        run: date > ordered.flag

      - name: Sauvegarder le marqueur
        if: steps.decide.outputs.run == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: ordered.flag
          key: commande-${{ steps.gate.outputs.day }}

      # E-mail récapitulatif (choix, solde, captures des plats disponibles).
      # Ne fait jamais échouer la run : la commande est déjà passée et le
      # marqueur anti-doublon est déjà posé.
      # MAIL_A_CHAQUE_COMMANDE: "false" = mail seulement si le solde est bas.
      - name: Mail récapitulatif
        if: steps.decide.outputs.run == 'true' && success()
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEUIL_SOLDE: "1.00"
          MAIL_A_CHAQUE_COMMANDE: "true"
        run: python mail_commande.py

      - name: Sauvegarder les captures et pages d'erreur
        if: always() && steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: captures-commande
          path: |
            *.png
            *.html
          if-no-files-found: ignore